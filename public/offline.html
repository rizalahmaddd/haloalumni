<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sedang offline</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #000; --muted: #55555c; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #c2c2c8; --accent: #2997ff; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; padding: 32px 28px; border-radius: 26px; background: var(--card); text-align: center;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 10px 26px -14px rgba(0,0,0,.26); }
  img { width: 72px; height: 72px; }
  h1 { margin: 18px 0 6px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  button { margin-top: 22px; width: 100%; height: 50px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
    font: 600 17px system-ui, -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/icon-192.png" alt="">
  <h1>Sedang offline</h1>
  <p>Periksa koneksi internet, lalu muat ulang halaman.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
